aid: eclipse-foods
name: Eclipse Foods
description: 'Eclipse Foods is a Berkeley, California plant-based food company making non-dairy ice cream
  and soft-serve engineered from cassava, corn, rapeseed, and potato to replicate the taste and texture of
  traditional dairy. Marketed as chef-crafted (co-founder brings 16-Michelin-Star kitchen experience) and
  sold in gallon tubs and soft-serve mixes to consumers and foodservice operators. Backed by Initialized
  Capital. This is a consumer/CPG brand with a WordPress marketing storefront and no public developer API;
  the profile captures its web identity, published llms.txt, and domain-security posture.'
